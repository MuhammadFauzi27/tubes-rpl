      summary: Inisiasi pembayaran cashless (publik — pelanggan)
      description: |
        Pelanggan memilih metode pembayaran (QRIS atau e-wallet) dari halaman keranjang.
        Untuk QRIS, response berisi `qris_data` yang di-render menjadi QR image di client.
        Pembayaran dikonfirmasi oleh payment gateway via webhook.
        **Tidak memerlukan login.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            examples:
              qris:
                summary: Bayar QRIS
                value:
                  payment_method: qris
              ewallet:
                summary: Bayar E-Wallet
                value:
                  payment_method: ewallet
                  ewallet_provider: "GoPay"
      responses:
        "201":
          description: Pembayaran berhasil diinisiasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Payment'
        "409":
          description: Pesanan sudah dibayar atau belum bisa dibayar (status belum sesuai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
