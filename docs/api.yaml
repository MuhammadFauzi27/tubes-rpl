# ============================================================
# WEBHOOKS
# ============================================================
webhooks:

  qris-payment-callback:
    post:
      tags: [Payments]
      summary: Callback dari payment gateway QRIS
      description: |
        Dipanggil payment gateway setelah pembayaran QRIS berhasil atau gagal.
        Server harus membalas HTTP 200 sebagai konfirmasi penerimaan.
        Saat status `success`, payment_status otomatis diubah ke `paid`
        dan order_status diubah ke `completed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_ref, status, amount]
              properties:
                transaction_ref:
                  type: string
                  example: "QRIS-20240901-ABC123"
                status:
                  type: string
                  enum: [success, failed]
                  example: success
                amount:
                  type: number
                  example: 116550
                payment_id:
                  $ref: '#/components/schemas/UUID'
                paid_at:
                  type: string
                  format: date-time
                gateway_ref:
                  type: string
                  description: Referensi internal payment gateway
      responses:
        "200":
          description: Callback diterima
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true

  order-status-webhook:
    post:
      tags: [Orders]
      summary: Notifikasi perubahan status order ke sistem eksternal
      description: |
        Opsional — berguna untuk layar dapur (kitchen display) atau display status pelanggan.
        Server POST ke URL yang telah didaftarkan setiap kali status order berubah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum:
                    - order.created
                    - order.confirmed
                    - order.processing
                    - order.ready
                    - order.delivered
                    - order.completed
                    - order.cancelled
                  example: "order.ready"
                timestamp:
                  $ref: '#/components/schemas/Timestamp'
                data:
                  type: object
                  properties:
                    order_id:
                      $ref: '#/components/schemas/UUID'
                    order_number:
                      type: string
                      example: "ORD-20240901-0001"
                    table_number:
                      type: string
                      example: "A3"
                    status:
                      $ref: '#/components/schemas/OrderStatus'
                    total:
                      type: number
                      example: 116550
      responses:
        "200":
          description: Webhook diterima

