  # ============================================================

  /dashboard/revenue-stats:
    get:
      tags: [Revenue]
      summary: Statistik pendapatan 7 hari (admin — Revenue Stats)
      description: |
        Data untuk halaman **Revenue Stats** — menampilkan semua data yang dibutuhkan
        dalam satu endpoint:
        - Total & rata-rata revenue 7 hari
        - Total & rata-rata pesanan 7 hari
        - Data transaksi sukses per hari (untuk grafik)
        - Top 10 menu terlaris (tidak perlu real-time)

        Window waktu selalu **7 hari ke belakang dari hari ini**.
        Tidak ada parameter `start_date` / `end_date` — fixed window.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statistik revenue 7 hari
          content:
            application/json:
              schema:
                type: object
                properties:
