x-error-codes:
  UNAUTHORIZED:
    description: Token JWT tidak ada, tidak valid, atau sudah expired
    http_status: 401
  FORBIDDEN:
    description: Role tidak punya izin untuk aksi ini
    http_status: 403
  NOT_FOUND:
    description: Resource tidak ditemukan
    http_status: 404
  VALIDATION_ERROR:
    description: Request body tidak valid
    http_status: 422
  CONFLICT:
    description: Konflik data
    http_status: 409
  INVALID_STATUS_TRANSITION:
    description: Perubahan status tidak valid
    http_status: 400
  INVALID_QR_TOKEN:
    description: Token QR tidak ditemukan atau sudah tidak berlaku
    http_status: 404
  MENU_UNAVAILABLE:
    description: Menu tidak tersedia saat order dibuat
    http_status: 409
  PAYMENT_ALREADY_EXISTS:
    description: Pesanan sudah memiliki pembayaran aktif
    http_status: 409

x-order-status-transitions:
  description: Alur transisi status pesanan yang valid
  transitions:
    - from: pending
      to: [confirmed, cancelled]
      actor: admin
    - from: confirmed
      to: [processing, cancelled]
      actor: admin
    - from: processing
      to: [ready]
      actor: admin
    - from: ready
      to: [delivered]
      actor: admin
    - from: delivered
      to: [completed]
      actor: admin
    - from: completed
      to: []
      actor: none
      note: Status final — tidak bisa diubah
    - from: cancelled
      to: []
      actor: none
      note: Status final — tidak bisa diubah

x-role-permissions:
  public_no_token:
    description: Pelanggan tanpa token apapun
    endpoints:
      - "GET /tables/scan/{token}"
      - "GET /categories"
      - "GET /menu"
      - "GET /menu-items/{id}"
      - "GET /orders/{id}"
      - "GET /orders/{id}/status"

  public_with_session_token:
    description: Pelanggan dengan X-Session-Token dari hasil scan QR
    endpoints:
      - "POST /orders"
      - "POST /orders/{id}/payment"

  admin:
    description: Admin (pemilik restoran) — wajib Bearer JWT
    endpoints:
      - "GET/POST /auth/*"
      - "GET /tables"
      - "POST /tables"
      - "GET/PATCH/DELETE /tables/{id}"
      - "POST /tables/{id}/regenerate-qr"
      - "POST /categories"
      - "PATCH/DELETE /categories/{id}"
      - "GET/POST /menu-items"
      - "PATCH/DELETE /menu-items/{id}"
      - "PATCH /menu-items/{id}/toggle-availability"
      - "GET /orders"
      - "PATCH /orders/{id}/status"
      - "GET /payments/{id}"
      - "GET /dashboard/summary"
      - "GET /dashboard/revenue-stats"

